name: Gate History Secret Scan (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      expected-source-sha:
        description: Exact reviewed current Gate main SHA containing this scanner
        required: true
        type: string

permissions:
  contents: read

jobs:
  history:
    if: >-
      ${{ github.repository == 'markmalina/gate' &&
          github.repository_id == '1293746267' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'markmalina' && github.actor_id == '23397294' &&
          github.run_attempt == 1 && inputs.expected-source-sha == github.sha &&
          github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check fetched history and source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Obtain checksum-pinned scanner (Ops verified lock)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/gate-history-scan"
          cd "$RUNNER_TEMP/gate-history-scan"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output scanner.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file scanner.tar.gz --no-same-owner --no-same-permissions gitleaks
          chmod 0500 gitleaks

      - name: Scan Git refs and emit only value-free receipt
        id: scan
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_root="$RUNNER_TEMP/gate-history-scan"
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          printf '[extend]\nuseDefault = true\n' >"$scan_root/config.toml"
          : > "$scan_root/empty-ignore"
          git clone --mirror --no-hardlinks "$GITHUB_WORKSPACE" "$scan_root/repository.git" >"$scan_root/clone.log" 2>&1
          test "$(git -C "$scan_root/repository.git" rev-parse --is-shallow-repository)" = false
          test "$(git -C "$scan_root/repository.git" rev-parse HEAD)" = "$EXPECTED_SHA"
          ref_count="$(git -C "$scan_root/repository.git" for-each-ref --format='%(objectname)' | wc -l)"
          commit_count="$(git -C "$scan_root/repository.git" rev-list --all --count)"
          refs_digest="$(git -C "$scan_root/repository.git" for-each-ref --format='%(refname) %(objectname)' | sha256sum | cut -d' ' -f1)"
          set +e
          timeout 600 "$scan_root/gitleaks" git --config="$scan_root/config.toml" --log-opts='--all --full-history -m' \
            --ignore-gitleaks-allow --gitleaks-ignore-path="$scan_root/empty-ignore" \
            --no-banner --redact=100 --exit-code=23 --report-format=json \
            --report-path="$scan_root/raw.json" "$scan_root/repository.git" >"$scan_root/raw.log" 2>&1
          scan_exit=$?
          set -e
          python scripts/sanitize_history_secret_report.py \
            --raw "$scan_root/raw.json" --output "$RUNNER_TEMP/gate-history-safe.json" \
            --exit-code "$scan_exit" --source-sha "$EXPECTED_SHA" --complete-history true \
            --ref-count "$ref_count" --commit-count "$commit_count" --refs-digest "$refs_digest"

      - name: Upload only safe projection
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-history-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-history-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed for findings or incomplete scan
        if: ${{ always() }}
        env:
          SCAN_RESULT: ${{ steps.scan.outcome }}
        run: test "$SCAN_RESULT" = success

