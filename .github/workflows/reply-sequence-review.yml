name: Reply sequence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'tests/test_reply_sequence*.py'
      - 'tests/test_reply_sends_postgres.py'
      - 'tests/test_telegram_client.py'
      - 'tests/test_telegram_retry_after.py'
      - 'tests/test_reply_sequence_review_runner.py'
      - 'scripts/reply_sequence_review.py'
      - '.github/workflows/reply-sequence-review.yml'
      - 'pyproject.toml'
      - 'constraints/ci.txt'

permissions:
  contents: read

jobs:
  reply-sequence-postgres-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate_reply_sequence_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gate_reply_sequence_review
      GATE_ENV: ci
      GATE_DEFAULT_MODE: manual
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install pinned test dependencies
        run: |
          python -m pip install -c constraints/ci.txt '.[dev,contact-sync]'
          python -m pip check
      - name: Check review runner guards
        run: python -m pytest -o addopts='' -q tests/test_reply_sequence_review_runner.py
      - name: Execute exact-head review with no skipped cases
        env:
          REVIEW_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/reply_sequence_review.py
          --candidate-sha "$REVIEW_CANDIDATE_SHA"
          --disposable-database
          --output reply-sequence-review-evidence
      - name: Upload review execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reply-sequence-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: reply-sequence-review-evidence/
          if-no-files-found: error
          retention-days: 14
