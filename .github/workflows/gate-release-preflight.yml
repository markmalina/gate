name: Gate-local release read-only preflight

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  observe:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'edited' &&
      github.event.changes.body &&
      github.repository == 'markmalina/gate' &&
      github.repository_id == '1293746267' &&
      github.repository_owner_id == '23397294' &&
      github.actor_id == '23397294' &&
      github.event.sender.id == 23397294 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.id == 1293746267 &&
      github.event.pull_request.head.repo.fork == false &&
      github.run_attempt == 1 &&
      startsWith(github.event.pull_request.body, '/ops-gate-release-preflight expected-head-sha=')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gate-production
    concurrency:
      group: gate-production-deploy
      cancel-in-progress: false
    env:
      GATE_HELPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      GATE_PREFLIGHT_ENVIRONMENT: gate-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          check-latest: false
          package-manager-cache: false
      - name: Verify actual Gate workflow source without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE_HELPER_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GATE_HELPER_SOURCE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          # Public Gate only; no credential or provider fallback for this fetch.
          git -c http.extraheader= fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          node .github/actions/gate-release-preflight/local.mjs --check-caller
      - name: Observe fixed Gate target
        id: reader
        continue-on-error: true
        uses: ./.github/actions/gate-release-preflight
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
      - name: Retain redacted original receipt
        if: ${{ always() && steps.reader.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-release-preflight-${{ github.run_id }}
          path: |
            gate-release-preflight.json
            gate-release-preflight.sha256
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Verify original receipt bytes and provenance
        if: ${{ always() && steps.reader.outcome != 'skipped' }}
        shell: bash
        run: node .github/actions/gate-release-preflight/local.mjs --verify-receipt
