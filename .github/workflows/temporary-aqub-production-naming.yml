name: Temporary AQUB production naming refactor

on:
  pull_request:
    paths:
      - .github/workflows/temporary-aqub-production-naming.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rename AQUB production modules and symbols
        run: |
          git mv app/application/aqub_s0_preflight.py app/application/aqub_transport.py
          git mv app/infrastructure/aqub_s0_preflight.py app/infrastructure/aqub_installation.py
          git mv app/api/aqub_telegram_preflight.py app/api/aqub_telegram.py
          git mv tests/test_aqub_s0_preflight.py tests/test_aqub_transport.py
          git mv tests/test_aqub_telegram_preflight.py tests/test_aqub_telegram.py
          python - <<'PY'
          from pathlib import Path

          roots = [Path("app"), Path("tests")]
          replacements = {
              "app.application.aqub_s0_preflight": "app.application.aqub_transport",
              "app.infrastructure.aqub_s0_preflight": "app.infrastructure.aqub_installation",
              "app.api.aqub_telegram_preflight": "app.api.aqub_telegram",
              "AQUBPreflightRole": "AQUBTransportRole",
              "AQUBPreflightBinding": "AQUBTransportBinding",
              "AQUBPreflightInbound": "AQUBTransportInbound",
              "AQUBPreflightCommand": "AQUBTransportCommand",
              "AQUBPreflightStore": "AQUBTransportStore",
              "AQUBPreflightResult": "AQUBTransportResult",
              "AQUBS0PreflightAdapter": "AQUBDiagnosticPingAdapter",
              "SqlAQUBPreflightReceiptStore": "SqlAQUBTransportReceiptStore",
              "AQUB_PREFLIGHT_BOT_KEY": "AQUB_RECEIPT_BOT_KEY",
              "get_aqub_preflight_store": "get_aqub_transport_store",
          }
          for root in roots:
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          application = Path("app/application/aqub_transport.py")
          text = application.read_text(encoding="utf-8")
          text = text.replace(
              '"""Default-off AQUB S0 Telegram preflight boundary.\n\nThis module deliberately stops at the Gate transport boundary.  It proves that\none exact bot/group/actor binding can own ``/aqub_ping`` and durably commit an\ninbound command without invoking the AQUB domain engine, Telegram delivery, or\nany legacy/canary dispatcher.\n"""',
              '"""AQUB Telegram transport contracts and diagnostic ping boundary.\n\nProvider identifiers remain inside Gate while durable receipts expose only\nopaque references to the AQUB runtime.\n"""',
          )
          text = text.replace(
              '"""Release-pinned owner-only binding; blank defaults keep it dormant."""',
              '"""Durable installation binding resolved by the Gate provider boundary."""',
          )
          text = text.replace(
              '"""Own only the exact AQUB S0 binding and never perform provider effects."""',
              '"""Handle the diagnostic ping without performing provider effects."""',
          )
          text = text.replace('reply_text=f"AQUB S0: связь {role.value} подтверждена."', 'reply_text=f"AQUB: связь {role.value} подтверждена."')
          application.write_text(text, encoding="utf-8")

          config = Path("app/core/config.py")
          text = config.read_text(encoding="utf-8")
          stale = '''    gate_aqub_s0_preflight_enabled: bool = Field(\n        default=False, validation_alias="GATE_AQUB_S0_PREFLIGHT_ENABLED"\n    )\n    gate_aqub_group_chat_id: SecretStr = Field(\n        default=SecretStr(""), validation_alias="GATE_AQUB_GROUP_CHAT_ID"\n    )\n    gate_aqub_ace_user_id: SecretStr = Field(\n        default=SecretStr(""), validation_alias="GATE_AQUB_ACE_USER_ID"\n    )\n    gate_aqub_alpha_user_id: SecretStr = Field(\n        default=SecretStr(""), validation_alias="GATE_AQUB_ALPHA_USER_ID"\n    )\n    gate_aqub_s0_ready_at: str = Field(\n        default="", validation_alias="GATE_AQUB_S0_READY_AT"\n    )\n'''
          if text.count(stale) != 1:
              raise SystemExit("expected one stale AQUB config block")
          config.write_text(text.replace(stale, ""), encoding="utf-8")

          main = Path("app/main.py")
          text = main.read_text(encoding="utf-8")
          stale = '''    aqub_provider_readiness = AQUBProviderReadinessState(\n        enabled=bool(getattr(settings, "gate_aqub_s0_preflight_enabled", False))\n    )\n'''
          if text.count(stale) != 1:
              raise SystemExit("expected one stale AQUB readiness flag")
          main.write_text(
              text.replace(stale, "    aqub_provider_readiness = AQUBProviderReadinessState(enabled=True)\n"),
              encoding="utf-8",
          )
          PY
          git rm .github/workflows/temporary-aqub-production-naming.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "refactor(aqub): use production transport naming"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
