name: Gate credential check
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
concurrency:
  group: ${{ startsWith(github.event.label.name, format('c{0}-', github.event.pull_request.head.sha)) && 'gate736-credential-check' || format('gate736-credential-inactive-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  admission:
    if: >-
      github.event.pull_request.number == 766 && github.event.sender.id == 23397294 &&
      github.event.pull_request.head.repo.full_name == 'markmalina/gate' &&
      github.event.pull_request.head.ref == 'agent/736-autonomous-watch-queue' &&
      startsWith(github.event.label.name, format('c{0}-', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      admitted: ${{ steps.check.outputs.admitted }}
    steps:
      - id: check
        uses: markmalina/ops/agent-ops/actions/gate-credential-check@da16ee3a694868bc3b3027b85f56817af98ad294
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}
        with:
          phase: admission
  observe:
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: gate-production
    outputs:
      digest: ${{ steps.check.outputs.receipt-digest }}
      receipt-id: ${{ steps.receipt.outputs.artifact-id }}
      detached-id: ${{ steps.detached.outputs.artifact-id }}
    steps:
      - id: check
        uses: markmalina/ops/agent-ops/actions/gate-credential-check@da16ee3a694868bc3b3027b85f56817af98ad294
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          phase: observe
      - id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ops-credential-observation.json
          path: ops-credential-observation.json
          archive: false
          retention-days: 3
          if-no-files-found: error
      - id: detached
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ops-credential-observation.sha256
          path: ops-credential-observation.sha256
          archive: false
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe.outputs.receipt-id }},${{ needs.observe.outputs.detached-id }}
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - uses: markmalina/ops/agent-ops/actions/gate-credential-check@da16ee3a694868bc3b3027b85f56817af98ad294
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}
        with:
          phase: verify
          expected-digest: ${{ needs.observe.outputs.digest }}
          receipt-id: ${{ needs.observe.outputs.receipt-id }}
          detached-id: ${{ needs.observe.outputs.detached-id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ops-credential-verification.json
          path: ops-credential-verification.json
          archive: false
          retention-days: 3
          if-no-files-found: error
      - run: node -e "const r=require('./ops-credential-verification.json');if(r.result!=='VERIFIED_PROJECT_ENVIRONMENT_AUTH_ONLY'||r.releaseAuthorized!==false)process.exit(1)"
