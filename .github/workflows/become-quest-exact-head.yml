name: BECOME Quest exact-head CI

on:
  pull_request:
    paths:
      - "alembic/versions/0082_become_quest.py"
      - "alembic/versions/0083_become_quest_corrective.py"
      - "alembic/versions/0083_alpha_transcription_product.py"
      - "alembic/versions/0083_become_quest_corrective_merge.py"
      - "alembic/versions/0084_become_pilot_slice1_review.py"
      - "alembic/versions/0085_become_pilot_slice2_program.py"
      - "alembic/versions/0086_beta_katya_space.py"
      - "alembic/versions/0087_become_pilot_slice3_learner.py"
      - "alembic/versions/0088_beta_wedding_replies.py"
      - "alembic/versions/0089_beta_wedding_voice_phases.py"
      - "alembic/versions/0090_beta_wedding_checkpoints.py"
      - "alembic/versions/0091_beta_universal_material.py"
      - "alembic/versions/0097_beta_exact_scope.py"
      - "app/application/beta_space_intake.py"
      - "app/infrastructure/beta_space.py"
      - "app/infrastructure/beta_checkpoint_dispatch_drain.py"
      - "app/worker/beta_space.py"
      - "app/models/beta_space.py"
      - "tests/test_beta_space_intake.py"
      - "tests/test_beta_space_atomic_admission.py"
      - "tests/test_beta_checkpoint_dispatch_drain.py"
      - "tests/test_beta_material_checkpoint_terminal.py"
      - "tests/test_beta_exact_scope.py"
      - "app/application/beta_material.py"
      - "app/infrastructure/beta_material.py"
      - "app/infrastructure/beta_material_provider.py"
      - "app/models/beta_material.py"
      - "tests/test_beta_material.py"
      - "tests/test_beta_material_provider.py"
      - "app/application/beta_wedding_voice.py"
      - "app/infrastructure/beta_wedding_voice.py"
      - "app/infrastructure/beta_wedding_voice_provider.py"
      - "app/models/beta_wedding_voice.py"
      - "app/api/beta_telegram_ingress.py"
      - "tests/test_beta_wedding_voice.py"
      - "app/application/become_learner_invitation.py"
      - "app/infrastructure/become_learner_invitation.py"
      - "tests/test_become_learner_invitation.py"
      - "tests/test_become_learner_invitation_postgres.py"
      - "alembic/env.py"
      - "app/api/become_telegram_ingress.py"
      - "app/services/telegram_become_webhook.py"
      - "app/application/become_transcript_review.py"
      - "app/application/become_program_draft.py"
      - "app/application/become_voice_transcription.py"
      - "app/infrastructure/become_transcript_review.py"
      - "app/infrastructure/become_program_draft.py"
      - "app/infrastructure/become_voice_transcription.py"
      - "app/worker/become_pilot_maintenance.py"
      - "app/worker/telegram_processing.py"
      - "app/application/become_quest.py"
      - "app/infrastructure/become_quest.py"
      - "app/models/become_quest.py"
      - "app/models/become_program_draft.py"
      - "app/models/alpha_transcription.py"
      - "app/api/mcp_routes.py"
      - "app/api/mcp_schemas.py"
      - "tests/test_become_quest.py"
      - "tests/test_become_transcript_review.py"
      - "tests/test_become_program_draft.py"
      - "tests/test_become_transcript_review_postgres.py"
      - "tests/test_become_voice_transcription.py"
      - "tests/test_become_telegram_ingress.py"
      - "tests/test_telegram_become_webhook.py"
      - "tests/test_become_quest_postgres.py"
      - "tests/test_become_quest_migration.py"
      - "contracts/quest/v1/operation-contract-matrix.json"
      - "tests/test_mcp_routes.py"
      - "tests/test_mcp_chatgpt_oauth_discovery.py"
      - ".github/workflows/become-quest-exact-head.yml"

permissions:
  contents: read

jobs:
  quest:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      GATE_ENV: ci
      TELEGRAM_BOT_USERNAME: gate_m_bot
    steps:
      - name: Check out the PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev]"

      - name: Validate scoped voice reply context on the literal PR head
        run: |
          ruff check app/application/mcp_inbox.py app/api/mcp_routes.py app/api/mcp_schemas.py tests/test_mcp_voice_reply_context.py tests/test_mcp_routes.py
          pytest tests/test_mcp_voice_reply_context.py tests/test_mcp_routes.py

      - name: Lint and type-check Quest and transcription migration files
        run: |
          ruff check app/application/become_quest.py app/infrastructure/become_quest.py app/models/become_quest.py app/models/become_program_draft.py app/models/alpha_transcription.py app/api/become_telegram_ingress.py app/services/telegram_become_webhook.py app/application/become_transcript_review.py app/application/become_program_draft.py app/application/become_voice_transcription.py app/infrastructure/become_transcript_review.py app/infrastructure/become_program_draft.py app/infrastructure/become_voice_transcription.py app/worker/become_pilot_maintenance.py app/worker/telegram_processing.py tests/test_become_transcript_review.py tests/test_become_program_draft.py tests/test_become_transcript_review_postgres.py tests/test_become_voice_transcription.py tests/test_become_telegram_ingress.py tests/test_telegram_become_webhook.py tests/test_become_quest.py tests/test_become_quest_postgres.py tests/test_become_quest_migration.py alembic/versions/0082_become_quest.py alembic/versions/0083_become_quest_corrective.py alembic/versions/0083_alpha_transcription_product.py alembic/versions/0083_become_quest_corrective_merge.py alembic/versions/0084_become_pilot_slice1_review.py alembic/versions/0085_become_pilot_slice2_program.py alembic/versions/0086_beta_katya_space.py alembic/versions/0087_become_pilot_slice3_learner.py alembic/versions/0088_beta_wedding_replies.py app/application/become_learner_invitation.py app/infrastructure/become_learner_invitation.py tests/test_become_learner_invitation.py tests/test_become_learner_invitation_postgres.py
          mypy app

      - name: Test Quest state, persistence, replay, and migration safety
        run: pytest tests/test_become_program_draft.py tests/test_become_transcript_review.py tests/test_become_voice_transcription.py tests/test_become_telegram_ingress.py tests/test_telegram_become_webhook.py tests/test_become_quest.py tests/test_become_quest_postgres.py tests/test_become_quest_migration.py tests/test_become_transcript_review_postgres.py tests/test_become_learner_invitation.py tests/test_become_learner_invitation_postgres.py tests/test_beta_space_intake.py tests/test_telegram_worker_runtime.py

      - name: Validate exact Beta binding scope on the literal PR head
        run: |
          ruff check app/application/beta_space_intake.py app/api/beta_telegram_ingress.py app/infrastructure/beta_space.py app/infrastructure/beta_checkpoint_dispatch_drain.py app/infrastructure/beta_material.py app/models/beta_space.py app/models/beta_material.py app/models/beta_wedding_voice.py app/worker/beta_space.py tests/test_beta_space_intake.py tests/test_beta_space_atomic_admission.py tests/test_beta_telegram_ingress.py tests/test_beta_checkpoint_dispatch_drain.py tests/test_beta_material_checkpoint_terminal.py tests/test_beta_exact_scope.py alembic/versions/0097_beta_exact_scope.py
          pytest tests/test_beta_space_intake.py tests/test_beta_space_atomic_admission.py tests/test_beta_telegram_ingress.py tests/test_beta_checkpoint_dispatch_drain.py tests/test_beta_material_checkpoint_terminal.py tests/test_beta_exact_scope.py

      - name: Prove the single migration head and schema convergence
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic heads | grep -F " (head)"
          alembic upgrade head
          alembic check

      - name: Prove populated Quest backup and restore on the literal PR head
        env:
          PGPASSWORD: postgres
        run: |
          BECOME_SLICE3_PRESERVE_RESTORE_GRAPH=1 pytest -q tests/test_become_learner_invitation_postgres.py::test_slice3_migration_is_single_head_and_leaves_populated_restore_graph
          pg_dump --host localhost --username postgres --dbname gate --format custom --file /tmp/gate-quest-backup.dump
          dropdb --host localhost --username postgres --if-exists gate_quest_restore
          createdb --host localhost --username postgres gate_quest_restore
          pg_restore --host localhost --username postgres --dbname gate_quest_restore --no-owner --no-privileges /tmp/gate-quest-backup.dump
          python scripts/postgres_restore_evidence.py --database-url postgresql://postgres:postgres@localhost:5432/gate_quest_restore --output become-quest-postgres-restore-evidence.json
          recovery_graph_count="$(psql --host localhost --username postgres --dbname gate_quest_restore --tuples-only --no-align --command "SELECT count(*) FROM become_i4_recovery_receipts AS recovery JOIN workspaces AS workspace ON workspace.id = recovery.workspace_id JOIN become_voice_correlations AS correlation ON correlation.id = recovery.correlation_id AND correlation.workspace_id = recovery.workspace_id JOIN become_media_intakes AS intake ON intake.id = correlation.media_intake_id AND intake.workspace_id = recovery.workspace_id JOIN become_voice_chain_slots AS failed_slot ON failed_slot.id = recovery.failed_slot_id AND failed_slot.workspace_id = recovery.workspace_id AND failed_slot.correlation_id = recovery.correlation_id WHERE failed_slot.stage = 'mayaki' AND failed_slot.state = 'failed';")"
          test "$recovery_graph_count" -ge 1
          invalid_fk_count="$(psql --host localhost --username postgres --dbname gate_quest_restore --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE contype = 'f' AND NOT convalidated;")"
          test "$invalid_fk_count" -eq 0
          recovery_fk_count="$(psql --host localhost --username postgres --dbname gate_quest_restore --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE conname IN ('fk_become_i4_recovery_workspace', 'fk_become_i4_recovery_correlation', 'fk_become_i4_recovery_failed_slot') AND convalidated;")"
          test "$recovery_fk_count" -eq 3
          slice3_graph_count="$(psql --host localhost --username postgres --dbname gate_quest_restore --tuples-only --no-align --command "SELECT count(*) FROM become_slice3_invitations AS invitation JOIN become_slice3_learner_candidates AS candidate ON candidate.id=invitation.candidate_id JOIN become_pilot_program_drafts AS program ON program.id=invitation.program_id JOIN become_slice3_acceptances AS acceptance ON acceptance.invitation_id=invitation.id JOIN become_slice3_relations_outbox AS outbox ON outbox.acceptance_id=acceptance.id;")"
          test "$slice3_graph_count" -ge 1
          slice3_fk_count="$(psql --host localhost --username postgres --dbname gate_quest_restore --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE contype='f' AND conrelid IN ('become_slice3_learner_candidates'::regclass,'become_slice3_pilot_slots'::regclass,'become_slice3_invitations'::regclass,'become_slice3_acceptances'::regclass,'become_slice3_deliveries'::regclass,'become_slice3_relations_outbox'::regclass) AND convalidated;")"
          test "$slice3_fk_count" -ge 11

      - name: Upload exact-head Quest restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: become-quest-postgres-restore-evidence
          path: become-quest-postgres-restore-evidence.json
          if-no-files-found: error
          retention-days: 1


  synthetic-merge:
    name: Mandatory full synthetic-merge CI
    needs: quest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      GATE_ENV: ci
      TELEGRAM_BOT_USERNAME: gate_m_bot
      GATE_DEFAULT_MODE: manual
    steps:
      - name: Check out GitHub synthetic merge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Prove synthetic merge contains the exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" != "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_HEAD" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install full backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev,contact-sync]"
          python -m pip check

      - name: Full lint, type, and PostgreSQL test suite
        run: |
          ruff check .
          mypy app
          pytest

      - name: Full migration and restore proof
        env:
          PGPASSWORD: postgres
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check
          BECOME_SLICE3_PRESERVE_RESTORE_GRAPH=1 pytest -q tests/test_become_learner_invitation_postgres.py::test_slice3_migration_is_single_head_and_leaves_populated_restore_graph
          docker run --rm --network host -e PGPASSWORD postgres:17 pg_dump --host localhost --username postgres --dbname gate --format custom > /tmp/gate-synthetic-merge.dump
          docker run --rm --network host -e PGPASSWORD postgres:17 dropdb --host localhost --username postgres --if-exists gate_synthetic_restore
          docker run --rm --network host -e PGPASSWORD postgres:17 createdb --host localhost --username postgres gate_synthetic_restore
          docker run --rm --network host -e PGPASSWORD -i postgres:17 pg_restore --host localhost --username postgres --dbname gate_synthetic_restore --no-owner --no-privileges < /tmp/gate-synthetic-merge.dump
          python scripts/postgres_restore_evidence.py --database-url postgresql://postgres:postgres@localhost:5432/gate_synthetic_restore --output become-pilot-synthetic-restore-evidence.json
          slice3_graph_count="$(psql --host localhost --username postgres --dbname gate_synthetic_restore --tuples-only --no-align --command "SELECT count(*) FROM become_slice3_invitations AS invitation JOIN become_slice3_learner_candidates AS candidate ON candidate.id=invitation.candidate_id JOIN become_pilot_program_drafts AS program ON program.id=invitation.program_id JOIN become_slice3_acceptances AS acceptance ON acceptance.invitation_id=invitation.id JOIN become_slice3_relations_outbox AS outbox ON outbox.acceptance_id=acceptance.id;")"
          test "$slice3_graph_count" -ge 1

      - name: Upload synthetic-merge restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: become-pilot-synthetic-restore-evidence
          path: become-pilot-synthetic-restore-evidence.json
          if-no-files-found: error
          retention-days: 1
