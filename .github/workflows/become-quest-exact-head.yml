name: BECOME Quest exact-head CI

on:
  pull_request:
    paths:
      - "alembic/versions/0082_become_quest.py"
      - "alembic/versions/0083_become_quest_corrective.py"
      - "alembic/env.py"
      - "app/application/become_quest.py"
      - "app/infrastructure/become_quest.py"
      - "app/models/become_quest.py"
      - "app/api/mcp_routes.py"
      - "app/api/mcp_schemas.py"
      - "tests/test_become_quest.py"
      - "tests/test_become_quest_postgres.py"
      - "tests/test_become_quest_migration.py"
      - "contracts/quest/v1/operation-contract-matrix.json"
      - "tests/test_mcp_routes.py"
      - "tests/test_mcp_chatgpt_oauth_discovery.py"
      - ".github/workflows/become-quest-exact-head.yml"

permissions:
  contents: read

jobs:
  quest:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      GATE_ENV: ci
      TELEGRAM_BOT_USERNAME: gate_m_bot
    steps:
      - name: Check out the PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev]"

      - name: Lint and type-check Quest files
        run: |
          ruff check app/application/become_quest.py app/infrastructure/become_quest.py app/models/become_quest.py tests/test_become_quest.py tests/test_become_quest_postgres.py tests/test_become_quest_migration.py alembic/versions/0082_become_quest.py alembic/versions/0083_become_quest_corrective.py
          mypy app

      - name: Test Quest state, persistence, replay, and migration safety
        run: pytest tests/test_become_quest.py tests/test_become_quest_postgres.py tests/test_become_quest_migration.py

      - name: Prove the single migration head and schema convergence
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic heads | grep -F "0083_become_quest_corrective (head)"
          alembic upgrade head
          alembic check
