name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      TELEGRAM_BOT_USERNAME: gate_m_bot
      GATE_ENV: ci
      GATE_DEFAULT_MODE: manual
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal source SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Scan tracked runtime tree for sensitive literals
        run: python scripts/repository_sensitive_data_guard.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev,contact-sync]"
          python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Ensure real audio regression tools
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60 update -qq
            sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Pytest
        run: pytest
      - name: Alpha delivery-free release rehearsal
        run: >-
          pytest
          tests/test_alpha_model_shadow_rehearsal.py
          tests/test_alpha_model_adversarial_evals.py
          tests/test_alpha_model_product_evals.py
          tests/test_alpha_model_readiness.py
          tests/test_alpha_multigroup_postgres.py
          tests/test_alpha_release_evidence.py
      - name: Build Alpha release evidence
        run: python scripts/alpha_release_evidence.py --output alpha-release-evidence.json
      - name: Upload Alpha release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-release-evidence
          path: alpha-release-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Alpha incident recovery rehearsal
        run: >-
          pytest
          tests/test_telegram_worker_runtime.py
          tests/test_alpha_shadow_worker.py
          tests/test_alpha_delivery.py
          tests/test_alpha_delivery_postgres.py
          tests/test_alpha_model_shadow_rehearsal.py
          tests/test_alpha_model_readiness.py
          tests/test_alpha_incident_drills.py
      - name: Build Alpha incident evidence
        run: python scripts/alpha_incident_drills.py --output alpha-incident-drills.json
      - name: Upload Alpha incident evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-incident-drills
          path: alpha-incident-drills.json
          if-no-files-found: error
          retention-days: 1
      - name: Alpha privacy retention dry run
        run: pytest tests/test_alpha_retention.py
      - name: Alpha shadow release admission rehearsal
        run: pytest tests/test_alpha_shadow_release_admission.py
      - name: Build Alpha shadow release admission evidence
        run: python scripts/alpha_shadow_release_admission.py --output alpha-shadow-release-admission.json
      - name: Upload Alpha shadow release admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-shadow-release-admission
          path: alpha-shadow-release-admission.json
          if-no-files-found: error
          retention-days: 1
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Alembic schema drift check
        run: alembic check
      - name: Disposable PostgreSQL backup and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          docker run --rm --network host -e PGPASSWORD postgres:17 pg_dump --host localhost --username postgres --dbname gate --format custom > /tmp/gate-backup.dump
          docker run --rm --network host -e PGPASSWORD postgres:17 dropdb --host localhost --username postgres --if-exists gate_restore
          docker run --rm --network host -e PGPASSWORD postgres:17 createdb --host localhost --username postgres gate_restore
          docker run --rm --network host -e PGPASSWORD -i postgres:17 pg_restore --host localhost --username postgres --dbname gate_restore --no-owner --no-privileges < /tmp/gate-backup.dump
          python scripts/postgres_restore_evidence.py --database-url postgresql://postgres:postgres@localhost:5432/gate_restore --output postgres-restore-evidence.json
      - name: Upload PostgreSQL restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-restore-evidence
          path: postgres-restore-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Alembic downgrade
        run: alembic downgrade base
      - name: Docker build
        run: docker build -t gate:ci .
      - name: Assert web container runs unprivileged
        run: docker run --rm --entrypoint sh gate:ci -c 'test "$(id -u)" -ne 0'
      - name: Contact sync Docker build
        run: docker build -f Dockerfile.contact-sync -t gate-contact-sync:ci .
      - name: Assert contact sync container runs unprivileged
        run: docker run --rm --entrypoint sh gate-contact-sync:ci -c 'test "$(id -u)" -ne 0'

  windows-enrollment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install enrollment test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev]"
          python -m pip check
      - name: Native CurrentUser DPAPI round trip and offline preflight
        run: |
          pytest tests/test_personal_telegram_enrollment.py -k windows_native_dpapi_key_round_trip
          pytest tests/test_personal_telegram_preflight.py



  watch-baseline-fallback:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 766 &&
      github.event.pull_request.head.repo.full_name == 'markmalina/gate' &&
      contains(github.event.pull_request.labels.*.name, 'watch-baseline-fixture')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watch_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watch_baseline
      GATE_ENV: ci
      GATE_DEFAULT_MODE: manual
      GATE_WATCH_VOICE_ENABLED: "false"
      GATE_WATCH_VOICE_EARLY_INBOX_ENABLED: "false"
      GATE_WATCH_VOICE_WORK_RESERVE_ENABLED: "false"
      GATE_WATCH_VOICE_WORK_MCP_ENABLED: "false"
      WATCH_BASELINE_FALLBACK_FIXTURE: "1"
      PGPASSWORD: postgres
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7fd322c958cccf6828a3e8fcb00a075b2d4f1f46
          path: fallback
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fallback/constraints/ci.txt
      - name: Install exact fallback dependencies and the test harness
        run: |
          python -m pip install -c fallback/constraints/ci.txt "./fallback[dev]"
          python -m pip check
          cp tests/test_watch_voice_baseline_fallback_postgres.py fallback/tests/
      - name: Populate0115, upgrade0119, run old ready and Actions against HTTP stubs
        working-directory: fallback
        run: |
          python -m pytest tests/test_watch_voice_baseline_fallback_postgres.py -v --junitxml=watch-baseline.xml
      - name: Restore only the disposable synthetic PostgreSQL database
        run: |
          docker run --rm --network host -e PGPASSWORD postgres:17 pg_dump --host localhost --username postgres --dbname watch_baseline --format custom > /tmp/watch-baseline.dump
          docker run --rm --network host -e PGPASSWORD postgres:17 createdb --host localhost --username postgres watch_baseline_restore
          docker run --rm --network host -e PGPASSWORD -i postgres:17 pg_restore --host localhost --username postgres --dbname watch_baseline_restore --no-owner --no-privileges < /tmp/watch-baseline.dump
      - name: Verify restored originals, journals and actual old readiness
        working-directory: fallback
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watch_baseline_restore
          WATCH_BASELINE_RESTORED_ONLY: "1"
        run: python -m pytest tests/test_watch_voice_baseline_fallback_postgres.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: watch-baseline-fallback-evidence
          path: |
            fallback/watch-baseline-fallback.json
            fallback/watch-baseline-fallback-restore.json
            fallback/watch-baseline.xml
          if-no-files-found: error
          retention-days: 7
