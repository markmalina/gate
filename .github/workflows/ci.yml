name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      TELEGRAM_BOT_USERNAME: gate_m_bot
      GATE_ENV: ci
      GATE_DEFAULT_MODE: manual
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev,contact-sync]"
          python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest
      - name: Alpha delivery-free release rehearsal
        run: >-
          pytest
          tests/test_alpha_model_shadow_rehearsal.py
          tests/test_alpha_model_adversarial_evals.py
          tests/test_alpha_model_product_evals.py
          tests/test_alpha_model_readiness.py
          tests/test_alpha_multigroup_postgres.py
          tests/test_alpha_release_evidence.py
      - name: Build Alpha release evidence
        run: python scripts/alpha_release_evidence.py --output alpha-release-evidence.json
      - name: Upload Alpha release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-release-evidence
          path: alpha-release-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Alpha incident recovery rehearsal
        run: >-
          pytest
          tests/test_telegram_worker_runtime.py
          tests/test_alpha_shadow_worker.py
          tests/test_alpha_delivery.py
          tests/test_alpha_delivery_postgres.py
          tests/test_alpha_model_shadow_rehearsal.py
          tests/test_alpha_model_readiness.py
          tests/test_alpha_incident_drills.py
      - name: Build Alpha incident evidence
        run: python scripts/alpha_incident_drills.py --output alpha-incident-drills.json
      - name: Upload Alpha incident evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-incident-drills
          path: alpha-incident-drills.json
          if-no-files-found: error
          retention-days: 1
      - name: Alpha privacy retention dry run
        run: pytest tests/test_alpha_retention.py
      - name: Alpha shadow release admission rehearsal
        run: pytest tests/test_alpha_shadow_release_admission.py
      - name: Build Alpha shadow release admission evidence
        run: python scripts/alpha_shadow_release_admission.py --output alpha-shadow-release-admission.json
      - name: Upload Alpha shadow release admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-shadow-release-admission
          path: alpha-shadow-release-admission.json
          if-no-files-found: error
          retention-days: 1
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Alembic schema drift check
        run: alembic check
      - name: Disposable PostgreSQL backup and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump --host localhost --username postgres --dbname gate --format custom --file /tmp/gate-backup.dump
          dropdb --host localhost --username postgres --if-exists gate_restore
          createdb --host localhost --username postgres gate_restore
          pg_restore --host localhost --username postgres --dbname gate_restore --no-owner --no-privileges /tmp/gate-backup.dump
          python scripts/postgres_restore_evidence.py --database-url postgresql://postgres:postgres@localhost:5432/gate_restore --output postgres-restore-evidence.json
      - name: Upload PostgreSQL restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-restore-evidence
          path: postgres-restore-evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Alembic downgrade
        run: alembic downgrade base
      - name: Docker build
        run: docker build -t gate:ci .
      - name: Assert web container runs unprivileged
        run: docker run --rm --entrypoint sh gate:ci -c 'test "$(id -u)" -ne 0'
      - name: Contact sync Docker build
        run: docker build -f Dockerfile.contact-sync -t gate-contact-sync:ci .
      - name: Assert contact sync container runs unprivileged
        run: docker run --rm --entrypoint sh gate-contact-sync:ci -c 'test "$(id -u)" -ne 0'
