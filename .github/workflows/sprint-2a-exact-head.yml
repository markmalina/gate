name: Sprint 2A exact head

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  default-off-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove literal PR head checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository checks
        run: python -m pip install -c constraints/ci.txt ".[dev]"
      - name: Run targeted safety proof
        run: |
          ruff check app/become/role_aware_contract.py app/become/role_aware_downstream.py tests/test_role_aware_downstream.py
          mypy app
          pytest tests/test_role_aware_downstream.py
