name: Temporary AQUB transport test rename

on:
  pull_request:
    paths:
      - .github/workflows/temporary-aqub-test-rename.yml

permissions:
  contents: write

jobs:
  rename:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rename remaining transport test and remove this workflow
        run: |
          git mv tests/test_aqub_s0_preflight_postgres.py tests/test_aqub_transport_postgres.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_aqub_transport_postgres.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '"""PostgreSQL proof that AQUB preflight receipts never enter the common queue."""',
              '"""PostgreSQL proof that AQUB transport receipts stay outside the common queue."""',
          )
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/temporary-aqub-test-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test(aqub): rename transport postgres proof"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
