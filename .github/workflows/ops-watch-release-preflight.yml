name: Gate Watch release preflight observation

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: gate736-cli-state-observation
  cancel-in-progress: false

jobs:
  admission:
    if: >-
      github.event.pull_request.number == 766 &&
      github.event.sender.id == 23397294 &&
      startsWith(github.event.label.name, format('w{0}-', github.event.pull_request.head.sha)) &&
      github.event.pull_request.head.repo.full_name == 'markmalina/gate' &&
      github.event.pull_request.head.ref == 'agent/736-autonomous-watch-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - id: admission
        uses: markmalina/ops/agent-ops/actions/gate-watch-release-preflight@30d1e1914eb21aa12f0f4897bc5b5e4aa8c1f382
        with:
          phase: admission
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}

  observe:
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: gate-production
    outputs:
      receipt-digest: ${{ steps.observe.outputs.receipt-digest }}
      receipt-artifact-id: ${{ steps.receipt.outputs.artifact-id }}
      detached-artifact-id: ${{ steps.detached.outputs.artifact-id }}
    steps:
      - id: observe
        uses: markmalina/ops/agent-ops/actions/gate-watch-release-preflight@30d1e1914eb21aa12f0f4897bc5b5e4aa8c1f382
        with:
          phase: observe
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - id: receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ops-watch-release-observation.json
          archive: false
          if-no-files-found: error
          retention-days: 3
      - id: detached
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ops-watch-release-observation.sha256
          archive: false
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: observe
    if: always() && needs.observe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe.outputs.receipt-artifact-id }},${{ needs.observe.outputs.detached-artifact-id }}
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - uses: markmalina/ops/agent-ops/actions/gate-watch-release-preflight@30d1e1914eb21aa12f0f4897bc5b5e4aa8c1f382
        with:
          phase: verify
          expected-digest: ${{ needs.observe.outputs.receipt-digest }}
          receipt-artifact-id: ${{ needs.observe.outputs.receipt-artifact-id }}
          detached-artifact-id: ${{ needs.observe.outputs.detached-artifact-id }}
        env:
          AGENT_OPS_SOURCE_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ops-watch-release-verification.json
          archive: false
          if-no-files-found: error
          retention-days: 3
