name: Atlas Graphify snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "graphifyy==0.9.17"
      - name: Build private graph
        shell: bash
        run: |
          set +e
          graphify extract . --no-viz
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ ! -s graphify-out/graph.json ]; then
            mkdir -p graphify-out
            python - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          payload = {
              "metadata": {"generator": "atlas-manifest-fallback", "repository": repo},
              "nodes": [{"id": repo, "label": repo.split("/")[-1], "type": "repository"}],
              "edges": []
          }
          with open("graphify-out/graph.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          with open("graphify-out/GRAPH_REPORT.md", "w", encoding="utf-8") as fh:
              fh.write("# Graphify snapshot\n\nDeterministic repository manifest fallback. A semantic document graph requires an explicitly configured model backend.\n")
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphify-${{ github.event.repository.name }}
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          if-no-files-found: error
          retention-days: 30
