name: Temporary AQUB symbol cleanup

on:
  pull_request:
    paths:
      - .github/workflows/temporary-aqub-symbol-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove residual canary-era AQUB symbols
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "AQUB_OWNED_PATH": "AQUB_TELEGRAM_WEBHOOK_PATH",
              "AQUBProviderPreflightError": "AQUBProviderError",
          }
          for root in (Path("app"), Path("tests")):
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
          PY
          git rm .github/workflows/temporary-aqub-symbol-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "refactor(aqub): remove residual preflight symbols"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
