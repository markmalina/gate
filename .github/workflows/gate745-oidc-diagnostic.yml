name: Gate745 key-free OIDC diagnostic

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  id-token: write

concurrency:
  group: gate745-oidc-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      ${{ github.repository == 'markmalina/gate' && github.repository_id == '1293746267' &&
          github.event.number == 771 && github.event.pull_request.state == 'open' &&
          github.event.pull_request.head.repo.id == 1293746267 &&
          github.event.pull_request.head.ref == 'agent/745-metadata-bootstrap-client' &&
          github.event.sender.id == 23397294 && github.event.sender.type == 'User' &&
          github.actor_id == '23397294' && github.run_attempt == 1 &&
          startsWith(github.event.label.name, 'o') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gate-production
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          check-latest: false
          package-manager-cache: false
      - name: Refuse stale diagnostic output
        shell: bash
        run: test ! -e .agent-ops/output/gate745-oidc-diagnostic.json
      - name: Observe fixed OIDC predicates without an App key
        id: diagnostic
        uses: markmalina/ops/agent-ops/actions/gate745-oidc-diagnostic@a1bab0a4657c30154be27e4bd2d6bdad7c5f9d7d
        with:
          gate-token: ${{ github.token }}
      - name: Save redacted non-authorizing diagnostic
        if: ${{ always() && hashFiles('.agent-ops/output/gate745-oidc-diagnostic.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate745-oidc-diagnostic
          path: |
            .agent-ops/output/gate745-oidc-diagnostic.json
            .agent-ops/output/gate745-oidc-diagnostic.sha256
          retention-days: 7
          if-no-files-found: error
