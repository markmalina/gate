name: Gate Maintenance Caller Candidate (OFF)

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # LITERAL OFF. Removing only this guard is insufficient: maintenance-entry
  # still stops before secret access on the documented artifact lifecycle gap.
  preflight:
    if: >-
      ${{
        false &&
        github.repository == 'markmalina/gate' &&
        github.repository_id == '1293746267' &&
        github.actor == 'markmalina' &&
        github.actor_id == '23397294' &&
        github.event.issue.number == 815 &&
        !github.event.issue.pull_request &&
        github.event.action == 'created' &&
        github.ref == 'refs/heads/main' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Stop at truthful artifact lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'Default-OFF source only: artifact id is unavailable before receipt upload.'
          exit 1

  # Protected credentials belong only in a future effect job after a reviewed
  # two-phase artifact interface. No such job exists in this candidate.
