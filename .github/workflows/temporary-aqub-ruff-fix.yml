name: Temporary AQUB Ruff import cleanup

on:
  pull_request:
    paths:
      - .github/workflows/temporary-aqub-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.21
      - name: Fix only import ordering in AQUB files
        run: |
          ruff check --select I --fix \
            app/application/aqub_live.py \
            app/infrastructure/aqub_installation.py \
            tests/test_aqub_live.py \
            tests/test_aqub_s0_preflight_postgres.py \
            tests/test_aqub_telegram.py \
            tests/test_telegram_aqub_provider.py
          git rm .github/workflows/temporary-aqub-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "style(aqub): normalize renamed imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
