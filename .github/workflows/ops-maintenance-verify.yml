name: Gate Maintenance Completed Verification (OFF)
on:
  workflow_run:
    workflows: ['Gate Maintenance Caller Candidate (OFF)']
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  verify:
    if: >-
      ${{ false && github.repository == 'markmalina/gate' && github.repository_id == '1293746267' &&
          github.event.action == 'completed' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Bind completed original run using fixed readers
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node .github/actions/gate-deploy/maintenance-entry.mjs verify "$RUNNER_TEMP/maintenance-binding.json"
