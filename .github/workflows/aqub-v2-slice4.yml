name: AQUB v2 Slice 4

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/aqub-v2-slice4.yml"
      - "alembic/versions/0100_aqub_v2_delivery_ledger.py"
      - "app/application/aqub_delivery_v2.py"
      - "app/models/aqub_delivery_v2.py"
      - "app/models/__init__.py"
      - "tests/test_aqub_delivery_v2.py"

permissions:
  contents: read

concurrency:
  group: aqub-v2-slice4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert literal pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install exact validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev,contact-sync]"
          python -m pip check
      - name: Lint and type check
        run: |
          ruff check .
          mypy app
      - name: Focused crash, idempotency, route and tamper rehearsal
        run: pytest tests/test_aqub_delivery_v2.py
      - name: Migration and schema drift rehearsal
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 0099_telegram_caption_backfill
          alembic upgrade head
