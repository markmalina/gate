name: AQUB v2 Slice 4

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/aqub-v2-slice4.yml"
      - "alembic/versions/0100_aqub_v2_delivery_ledger.py"
      - "alembic/versions/0101_aqub_v2_delivery_capabilities.py"
      - "alembic/versions/0102_aqub_v2_data_lifecycle.py"
      - "app/api/aqub_delivery_v2_internal.py"
      - "app/application/aqub_contract_v2.py"
      - "app/application/aqub_delivery_v2.py"
      - "app/application/aqub_delivery_v2_store.py"
      - "app/application/aqub_synthetic_rehearsal.py"
      - "app/core/config.py"
      - "app/main.py"
      - "app/models/aqub_delivery_v2.py"
      - "app/models/__init__.py"
      - "contracts/aqub/v2/fixtures/delivery-command.valid.json"
      - "contracts/aqub/v2/schemas/delivery-command.v2.schema.json"
      - "contracts/aqub/v2/rehearsal/food-synthetic-command.v1.json"
      - "contracts/aqub/v2/rehearsal/food-synthetic-rehearsal-manifest.v1.json"
      - "docs/runbooks/aqub-v2-slice5-rollout.md"
      - "docs/privacy/aqub-v2-data-manifest.json"
      - "docs/privacy/aqub-v2-policy-decisions.md"
      - "docs/decisions/0015-aqub-v2-data-lifecycle.md"
      - "tests/test_aqub_contract_v2.py"
      - "tests/test_aqub_delivery_v2.py"
      - "tests/test_aqub_delivery_v2_internal.py"
      - "tests/test_aqub_data_lifecycle_v2.py"
      - "tests/test_aqub_synthetic_rehearsal.py"
      - "tests/support/aqub_synthetic_rehearsal_bridge.py"

permissions:
  contents: read

concurrency:
  group: aqub-v2-slice4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: aqub-transport / exact-head real Work I rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AQUB_REHEARSAL_HEAD_SHA: 830cd6161b27ebbc9b817d72b38090b9f6c9a2c6
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gate
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert literal pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install exact validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt ".[dev,contact-sync]"
          python -m pip check
      - name: Lint and type check
        run: |
          ruff check .
          mypy app
      - name: Focused crash, idempotency, route and tamper rehearsal
        run: >-
          pytest
          tests/test_aqub_contract_v2.py
          tests/test_aqub_delivery_v2.py
          tests/test_aqub_delivery_v2_internal.py
          tests/test_aqub_data_lifecycle_v2.py
          tests/test_aqub_synthetic_rehearsal.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Checkout literal AQUB rehearsal head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: AlphaCenter/aqub
          ref: ${{ env.AQUB_REHEARSAL_HEAD_SHA }}
          path: work-i-aqub
          persist-credentials: false
      - name: Assert literal AQUB rehearsal head
        run: test "$(git -C work-i-aqub rev-parse HEAD)" = "$AQUB_REHEARSAL_HEAD_SHA"
      - name: Real AQUB coordinator to Gate ledger two-repository rehearsal
        run: |
          cmp \
            work-i-aqub/contracts/rehearsal/food-synthetic-command.v1.json \
            contracts/aqub/v2/rehearsal/food-synthetic-command.v1.json
          cmp \
            work-i-aqub/contracts/rehearsal/food-synthetic-rehearsal-manifest.v1.json \
            contracts/aqub/v2/rehearsal/food-synthetic-rehearsal-manifest.v1.json
          cd work-i-aqub
          WORK_I_GATE_CHECKOUT="$GITHUB_WORKSPACE" \
            node --test test/omark-food-two-repo-rehearsal.test.js
      - name: Migration and schema drift rehearsal
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 0099_telegram_caption_backfill
          alembic upgrade head
