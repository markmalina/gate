name: BECOME I4 internal service

on:
  pull_request:
    paths:
      - "app/become_i4_service.py"
      - "tests/test_become_i4_service.py"
      - "contracts/proof-loop/i4/fixtures/gate-service-request.json"
      - "railway.i4.toml"
      - "Dockerfile.i4"
      - "docs/evidence/BECOME-I4-GATE-STAGING.md"
      - ".github/workflows/become-i4-check.yml"

permissions:
  contents: read

jobs:
  gate-i4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prove exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile internal service
        run: python -m py_compile app/become_i4_service.py tests/test_become_i4_service.py
      - name: Run frozen I4 contract tests
        run: python -m unittest tests/test_become_i4_service.py -v
      - name: Validate synthetic fixture JSON
        run: python -m json.tool contracts/proof-loop/i4/fixtures/gate-service-request.json >/dev/null
      - name: Validate dedicated Railway config and image isolation
        run: python -m unittest tests.test_become_i4_service.TestGateI4Service.test_dedicated_railway_image_cannot_start_production_app -v
      - name: Build and probe the isolated I4 image
        run: |
          docker build --file Dockerfile.i4 --tag gate-i4:test .
          test "$(docker image inspect gate-i4:test --format '{{json .Config.Cmd}}')" = '["python","-m","app.become_i4_service"]'
          trap 'docker rm --force gate-i4-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name gate-i4-test \
            --publish 127.0.0.1:18080:8000 \
            --env PORT=8000 \
            --env HOST=0.0.0.0 \
            --env BECOME_INTERNAL_ONLY=true \
            --env BECOME_RUNTIME_MODE=SIMULATED_TEST \
            --env BECOME_LIVE_ENABLED=false \
            --env BECOME_PROVIDER_SEND_ENABLED=false \
            --env BECOME_PAYMENT_ENABLED=false \
            --env BECOME_PUBLICATION_ENABLED=false \
            --env BECOME_MEDIA_DOWNLOAD_ENABLED=false \
            --env BECOME_EXTERNAL_EFFECTS_ENABLED=false \
            --env BECOME_I4_CONTRACT_DIGEST=91c3a210709c63738358bd0c512d11a9668acabd0997afcd68ba240bed38f573 \
            --env BECOME_IC9_DIGEST=e8b30118dbd754a841e575b0bc3cb8681461381b1b138d2fa1b3a75c28e2a5e7 \
            --env BECOME_SOURCE_SHA=${{ github.event.pull_request.head.sha }} \
            gate-i4:test
          for attempt in $(seq 1 20); do
            if response=$(curl --fail --silent --show-error \
              http://127.0.0.1:18080/healthz 2>/dev/null); then
              echo "$response" | grep --fixed-strings '"service":"gate"'
              exit 0
            fi
            sleep 1
          done
          docker logs gate-i4-test
          exit 1
