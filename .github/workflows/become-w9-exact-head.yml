name: BECOME W9 exact-head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "src/become_w9/**"
      - "tests/test_become_w9_chaos_recovery.py"
      - "contracts/proof-loop/v9/**"
      - ".github/workflows/become-w9-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w9-exact-head:
    name: W9 reconciliation (exact PR head; drafts included)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out dispatched ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prove exact head identity
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile W9 package and tests
        run: >-
          python -m py_compile
          src/become_w9/chaos_recovery.py
          tests/test_become_w9_chaos_recovery.py

      - name: Run W9 reconciliation checks
        run: >-
          python -m unittest discover
          -s tests
          -p 'test_become_w9_chaos_recovery.py'
          -v
