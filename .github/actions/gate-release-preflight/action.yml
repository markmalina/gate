name: Gate-local read-only release preflight
description: Pinned fixed-query reader; no mutation or provisioning
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      env:
        RAILWAY_PROJECT_TOKEN: ""
        GITHUB_READ_TOKEN: ""
      with:
        node-version: 24.19.0
        check-latest: false
        package-manager-cache: false
    - shell: bash
      run: node "${{ github.action_path }}/local.mjs"
