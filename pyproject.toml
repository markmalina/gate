[project]
name = "gate"
version = "0.1.0"
description = "Cloud-first FastAPI communication gateway backend."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "cryptography>=43.0,<47.0",
  "defusedxml==0.7.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "olefile==0.47",
  "Pillow>=11.3,<13",
  "openpyxl>=3.1.5,<4.0.0",
  "pypdf>=5.9.0,<7.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "PyJWT[crypto]>=2.9.0,<3.0.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
contact-sync = [
  "Telethon==1.44.0",
]
personal-telegram = [
  "Telethon==1.44.0",
]
dev = [
  "aiosqlite>=0.22.1,<0.23",
  "anyio>=4.4.0",
  "jsonschema>=4.23.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "setuptools>=69",
  "wheel",
]

[project.scripts]
gate-contact-sync = "app.contact_sync.cli:main"
gate-personal-telegram-enroll = "app.personal_telegram.cli:main"
gate-personal-telegram-preflight = "app.personal_telegram.preflight_cli:main"
gate-personal-telegram-check-auth = "app.personal_telegram.auth_check_cli:main"
gate-personal-telegram-cloud-check = "app.personal_telegram.cloud_check_cli:main"
gate-reply-send-recovery = "app.worker.reply_send_recovery:main"
gate-telegram-worker = "app.worker.telegram_processing:main"
gate-become-preflight = "app.become.runtime_preflight:main"
gate-become-pilot-maintenance = "app.worker.become_pilot_maintenance:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/sprint10_routes.py" = ["E501", "F401", "I001"]
"tests/test_sprint10_draft_edit.py" = ["I001"]
"app/api/sprint11b_routes.py" = ["E501", "I001"]
"tests/test_sprint11b_inline_actions.py" = ["E501", "I001"]
"alembic/versions/0005_multi_account_routing.py" = ["E501"]
"src/become_w1/transport_store.py" = ["E501"]
"src/become_w2/entry_adapter.py" = ["E501"]
"src/become_w3/voice_text_intake.py" = ["E501"]
"src/become_w5/controlled_effects.py" = ["E501"]
"src/become_w6/learner_delivery.py" = ["E501"]
"src/become_w7/stars_test_order.py" = ["E501"]
"src/become_w8/referral_delivery.py" = ["E501"]
"app/api/mcp_transcription_routes.py" = ["I001"]
"app/application/alpha_transcription_product.py" = ["E501"]
"app/api/beta_telegram_ingress.py" = ["I001"]
"app/infrastructure/beta_checkpoint_dispatch_drain.py" = ["I001"]
"app/infrastructure/beta_material.py" = ["I001"]
"app/infrastructure/beta_material_provider.py" = ["I001"]
"app/infrastructure/beta_space.py" = ["I001"]
"app/infrastructure/beta_space_checkpoint_batches.py" = ["I001"]
"app/infrastructure/beta_space_work.py" = ["I001"]
"app/infrastructure/beta_wedding_reply.py" = ["I001"]
"app/models/beta_material.py" = ["I001"]
"app/models/beta_space.py" = ["I001"]
"app/models/beta_wedding_voice.py" = ["I001"]
"app/worker/beta_space.py" = ["I001"]
"tests/test_alpha_transcription_product.py" = ["I001"]
"tests/test_alpha_transcription_receipts.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = "app.api.routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.sprint9_routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.sprint14_routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.main"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.services.telegram"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "docs*"]




