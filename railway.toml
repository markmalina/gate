[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "alembic upgrade head"
startCommand = "/bin/sh -c 'export TELEGRAM_AQUB_BOT_TOKEN=\"${TELEGRAM_AQUB_BOT_TOKEN:-$TELEGRAM_AQUBAGENTBOT_TOKEN}\"; GATE_AQUB_RUNTIME_URL=https://aqub-production.up.railway.app exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
