# SOURCE ONLY: do not install until fixed operator/workflow admission exists.
# Explicit fixture configuration replaces ordinary Gate predeploy/start only
# for a reviewed isolated target. It is not selected by railway.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ""
startCommand = "python -m app.worker.gate745_fixture_bootstrap bootstrap"
restartPolicyType = "NEVER"
